<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Powerbeam Technologies</title>
    <style>
      :root {
        --bg: #04070f;
        --panel: rgba(14, 23, 34, 0.9);
        --panel-border: rgba(148, 163, 184, 0.25);
        --text: #f8fafc;
        --muted: #b9c8d8;
        --accent: #2dd4bf;
        --accent-2: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(45, 212, 191, 0.12), transparent 30%),
          var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }

      .card {
        width: 1120px;
        height: 530px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.9));
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.7);
        padding: 52px 64px;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.05),
          transparent 50%,
          rgba(45, 212, 191, 0.08)
        );
        pointer-events: none;
      }

      .inner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        height: 100%;
      }

      .left {
        flex: 0 0 430px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-box {
        width: 380px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.02);
      }

      .logo-box img {
        width: 320px;
        max-height: 140px;
        object-fit: contain;
        filter: drop-shadow(0 8px 18px rgba(14, 116, 144, 0.3));
      }

      .right {
        flex: 1;
        padding-left: 42px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-2);
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      h1 {
        margin: 24px 0 18px;
        line-height: 1.05;
        font-size: 52px;
        letter-spacing: -0.05em;
        font-weight: 800;
      }

      .tagline {
        margin: 0 0 26px;
        font-size: 26px;
        line-height: 1.35;
        color: var(--muted);
        max-width: 540px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 28px;
      }

      .chip {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.24);
        color: #e2e8f0;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        padding-top: 20px;
        margin-top: 18px;
        width: 100%;
      }

      .domain {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 700;
      }

      .status {
        color: var(--accent);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="inner">
        <div class="left">
          <div class="logo-box">
            <img src="images/powerbeam-logo.png" alt="Powerbeam Technologies logo" />
          </div>
        </div>

        <div class="right">
          <div class="eyebrow">Bangladesh</div>
          <h1>Powerbeam Technologies</h1>
          <p class="tagline">Powering a Sustainable Future in Bangladesh</p>

          <div class="chips">
            <span class="chip">Solar Inverters</span>
            <span class="chip">Batteries</span>
            <span class="chip">ESS Solutions</span>
          </div>

          <div class="footer">
            <div class="domain">powerbeam.com.bd</div>
            <div class="status">Trusted Solar Partner</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
